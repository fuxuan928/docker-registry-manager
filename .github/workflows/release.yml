name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            artifact_name: docker-registry-manager-windows-amd64
            bundle_path: target/dx/docker-registry-manager/release/windows/
          - os: macos-latest
            platform: macos
            arch: amd64
            target: x86_64-apple-darwin
            artifact_name: docker-registry-manager-macos-amd64
            bundle_path: target/dx/docker-registry-manager/release/macos/
          - os: macos-latest
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            artifact_name: docker-registry-manager-macos-arm64
            bundle_path: target/dx/docker-registry-manager/release/macos/
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            artifact_name: docker-registry-manager-linux-amd64
            bundle_path: target/dx/docker-registry-manager/release/linux/

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          brew install openssl@3
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          sudo mkdir -p /usr/local/opt
          if [ ! -e /usr/local/opt/openssl@3 ]; then
            sudo ln -s "$OPENSSL_PREFIX" /usr/local/opt/openssl@3
          fi

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli --no-confirm

      - name: Build and Bundle
        run: dx bundle --platform ${{ matrix.platform }} --target ${{ matrix.target }} --release

      - name: List Output (for debugging)
        shell: bash
        run: ls -R target/dx/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -R

      - name: Archive release artifacts
        run: |
          tar -czf docker-registry-manager-windows-amd64.tar.gz docker-registry-manager-windows-amd64
          tar -czf docker-registry-manager-macos-amd64.tar.gz docker-registry-manager-macos-amd64
          tar -czf docker-registry-manager-macos-arm64.tar.gz docker-registry-manager-macos-arm64
          tar -czf docker-registry-manager-linux-amd64.tar.gz docker-registry-manager-linux-amd64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docker-registry-manager-windows-amd64.tar.gz
            docker-registry-manager-macos-amd64.tar.gz
            docker-registry-manager-macos-arm64.tar.gz
            docker-registry-manager-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
